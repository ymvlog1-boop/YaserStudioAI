name: Build and publish Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r source/requirements-lock.txt
      - name: Prepare models and licenses
        run: python source/setup_assets.py
      - name: Test processing and interface
        run: |
          python -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/scikit-image/scikit-image/v0.24.0/skimage/data/astronaut.png','astronaut.png')"
          python source/test_engine.py astronaut.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/test_ui.py astronaut.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable
        run: python source/build.py
      - name: Test executable
        run: |
          $p=Start-Process -FilePath rebuilt/YaserStudioAI/YaserStudioAI.exe -ArgumentList '--engine-test','astronaut.png','engine-test.json' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Executable test failed' }
          if (!(Test-Path engine-test.json)) { throw 'Missing test result' }
      - name: Package
        run: python source/package_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=python -c "import sys;sys.path.insert(0,'source');import updater;print(updater.VERSION)"
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Already published; increment VERSION for the next release.'; exit 0 }
          gh release create "v$version" --target $env:GITHUB_SHA --title "Yaser Studio AI $version" --notes 'Arabic Windows editor with automatic update checks and session handoff.' --draft release/Yaser-Studio-AI-Windows.zip release/Yaser-Studio-AI-Windows.zip.sha256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "v$version" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
