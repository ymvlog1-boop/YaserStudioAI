name: Build and publish Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r source/requirements-lock.txt
      - name: Prepare models and licenses
        run: python source/setup_assets.py
      - name: Test processing and interface
        run: |
          python -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/scikit-image/scikit-image/v0.24.0/skimage/data/astronaut.png','astronaut.png')"
          python source/test_engine.py astronaut.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/test_ui.py astronaut.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create Yaser icon
        run: python source/assets/create_icon.py
      - name: Build executable
        run: python source/build.py
      - name: Build installer
        run: |
          winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' source/installer/setup.iss
      - name: Test executable
        run: |
          $p=Start-Process -FilePath rebuilt/YaserStudioAI/YaserStudioAI.exe -ArgumentList '--engine-test','astronaut.png','engine-test.json' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Executable test failed' }
          if (!(Test-Path engine-test.json)) { throw 'Missing test result' }
      - name: Package
        run: python source/package_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=python -c "import sys;sys.path.insert(0,'source');import updater;print(updater.VERSION)"
          $draft=gh release view "v$version" --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $draft -eq 'false') { Write-Output 'Already published'; exit 0 }
          if ($LASTEXITCODE -ne 0) {
            gh release create "v$version" --target $env:GITHUB_SHA --title "Yaser Studio AI $version" --notes 'واجهة مصور جديدة: قبل/بعد جنباً إلى جنب وشريط الدفعة أسفل الشاشة، تنقية الوجه والرقبة واسترجاع تفاصيل الوجه، قوالب ألوان تلقائية، ضبابية الخلفية الأصلية، كي الملابس مع الحفاظ على اللون، والتحقق من الملفات المحفوظة.' --draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release edit "v$version" --target $env:GITHUB_SHA
          foreach ($asset in @('release/Yaser-Studio-AI-Windows.zip','release/Yaser-Studio-AI-Windows.zip.sha256','release/Yaser-Studio-AI-Setup.exe')) {
            $ok=$false
            for ($attempt=1; $attempt -le 4; $attempt++) {
              gh release upload "v$version" $asset --clobber
              if ($LASTEXITCODE -eq 0) { $ok=$true; break }
              Start-Sleep -Seconds 5
            }
            if (!$ok) { throw "Asset upload failed: $asset" }
          }
          gh release edit "v$version" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
